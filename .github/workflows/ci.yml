name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: |
          find api.pos -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  frontend:
    name: Nuxt build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lab-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8080
          NUXT_API_PROXY_TARGET: http://localhost:8080
