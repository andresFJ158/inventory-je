services:
  db:
    image: mariadb:11.4
    container_name: pos-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: u228744577_pos
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api.pos/u228744577_pos.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
